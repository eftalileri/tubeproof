[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tubeproof"
version = "0.1.0"
description = "Research real practitioner experience on YouTube: free knowledge only, claims cross-checked, confidence-scored."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp[default,curl-cffi]>=2026.10.26",
  "youtube-transcript-api>=1.2.4",
  "youtube-comment-downloader>=0.1.84",
  "trafilatura>=2.3",
  "httpx>=0.28",
  "pydantic>=2.10",
  "typer>=0.15",
  "rich>=13",
  "rapidfuzz>=3.10",
  "pyyaml>=6",
  "fastembed>=0.5",
  "numpy>=1.26",
  "mcp>=2.3",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.2"]
whisper-mlx = ["mlx-whisper>=0.4.3"]
browser = ["playwright>=1.50"]
docs = ["markitdown>=0.1.9"]
api = ["anthropic>=0.70"]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
tubeproof = "tubeproof.cli:app"
tubeproof-mcp = "tubeproof.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tubeproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
