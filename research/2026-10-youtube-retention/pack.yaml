relevance_notes: |
  3 = long-form YouTube craft that decides clicks and watch time: hooks and intros, retention graphs,
      titles and thumbnails (packaging), script writing and storytelling for YouTube, pacing and editing
      for retention, breakdowns of why specific videos hold viewers; tutorials and creator results both count.
  2 = general YouTube growth or algorithm explanations (how recommendations use CTR and watch time);
      screenwriting or storytelling courses outside YouTube.
  1 = upload settings, SEO, tags, descriptions, "do this after uploading" checklists, channel setup;
      Shorts-only or TikTok tips; editing-software tutorials; "make money / faceless automation" hype;
      equipment reviews.
